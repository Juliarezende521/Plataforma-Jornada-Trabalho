name: SQL Server and browser authentication

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'scripts/ci/**', '.github/workflows/auth-integration.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'scripts/ci/**', '.github/workflows/auth-integration.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real SQL Server, migrations, seed and HTTPS browser flow
        run: bash scripts/ci/validate-auth.sh
      - name: Browser reports and screenshots (no traces or secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
